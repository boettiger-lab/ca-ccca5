<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>California Plant Heat Vulnerability</title>

    <!--
        Geo-Chat core modules loaded from CDN, pinned to a release tag (@vX.Y.Z,
        4 places below). Never use @main in a deployed app: a merge can change
        behaviour under a running page. To upgrade, bump the tag in all four
        places together.
        Third-party libraries carry Subresource Integrity (integrity=) hashes —
        copy this file verbatim and do NOT hand-edit a hash; a mismatched hash
        blocks the script. Hashes only change when a library version is bumped.
        See the geo-agent quickstart docs.
    -->
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.js"
        integrity="sha384-U054LTKiMIJKEecR8PKFiUZdvkGWHjfPBnen5hSmR9TwfOfgZmKbskC8Rs9dCm/1"
        crossorigin="anonymous"></script>
    <link href="https://unpkg.com/maplibre-gl@5.22.0/dist/maplibre-gl.css" rel="stylesheet"
        integrity="sha384-MGCxhspF/+ufueUgol3FDkiAYQbpSNRhBT0VWHJt64U8qIy9qlnXWx8LAbj6niPH"
        crossorigin="anonymous" />

    <!-- PMTiles protocol -->
    <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"
        integrity="sha384-MjejsnWXHmuz93aE35YWLh5AbS/6ceRB3Vb+ukOwqFzJRTpQ8vvbkLbNV7I0QK4f"
        crossorigin="anonymous"></script>

    <!-- h3-js (for hex grid overlay) -->
    <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"
        integrity="sha384-nKUDlg+fT0U/eEt4KWP9n034kLe/eVj6k7CVjbu6qfRhJdEyinlGajS9+9AU+UZ5"
        crossorigin="anonymous"></script>

    <!-- Markdown rendering (lib/marked.umd.js is the package-shipped artifact;
         marked.min.js is CDN-generated and unsafe to hash) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.5/lib/marked.umd.js"
        integrity="sha384-ZD0fTOwPMHi7zM6WTVIWJR21I07lq0ccnqz3J6WMvQKG9thh4y7TA1QE6PJu0Af8"
        crossorigin="anonymous"></script>

    <!-- HTML sanitizer — chat-ui.js refuses to render markdown without it -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.8/dist/purify.min.js"
        integrity="sha384-jrsBdrv4eDpEYIq32u13DPbvB6tRmqIDnA6UlgFBoexpetaiWi7g/VbfMEL1WVen"
        crossorigin="anonymous"></script>

    <!-- Code highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
        integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH"
        crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
        integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"
        integrity="sha384-8q00eP+tyV9451aJYD5ML3ftuHKsGnDcezp7EXMEclDg1fZVSoj8O+3VyJTkXmWp"
        crossorigin="anonymous"></script>

    <!-- Core styles from CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/boettiger-lab/geo-agent@v3.28.0/app/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/boettiger-lab/geo-agent@v3.28.0/app/chat.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/boettiger-lab/geo-agent@v3.28.0/app/sidebar.css">
    <style>
        /* Boot placeholder — see #boot-status in the body. */
        #boot-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font: 14px/1.4 system-ui, sans-serif;
            color: #666;
            text-align: center;
        }
        #map.maplibregl-map #boot-status { display: none; }

        /* About link — plain anchor. Bottom-RIGHT, above the MapLibre
           attribution, and shifted by the sidebar width the same way the chart
           panels are.

           Not bottom-left: four core components already anchor there (#legend,
           #h3-toggle, #h3-res-badge and the reactive-control slider), and they
           already collide with each other in sidebar mode (geo-agent#359).
           There is no shared layout contract for these floating elements, so an
           app adding one has to pick a corner by inspecting the core CSS. */
        #about-link {
            position: absolute;
            bottom: 34px;
            right: calc(var(--sidebar-width, 0px) + 10px);
            z-index: 4;
            padding: 5px 10px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .92);
            border: 1px solid rgba(0, 0, 0, .18);
            box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
            color: #1c1b19;
            font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-decoration: none;
            letter-spacing: .01em;
        }
        #about-link:hover { background: #fff; }
        @media (prefers-color-scheme: dark) {
            #about-link {
                background: rgba(30, 29, 35, .92);
                border-color: rgba(255, 255, 255, .22);
                color: #eceaf0;
            }
            #about-link:hover { background: #1e1d23; }
        }
    </style>
</head>

<body>
    <!-- Map. #boot-status is a plain-HTML placeholder so a failed module load
         reads as "stuck loading" instead of an unexplained blank page. MapLibre
         adds .maplibregl-map to this container once the map exists, which hides
         it again — no JS coordination needed. See geo-agent#343. -->
    <div id="map">
        <div id="boot-status">Loading map modules…</div>
        <a id="about-link" href="about.html">About this tool &amp; data</a>
    </div>

    <!-- Layer controls — generated by MapManager.generateMenu() -->
    <div id="menu"></div>

    <!-- Boot from CDN -->
    <script type="module" src="https://cdn.jsdelivr.net/gh/boettiger-lab/geo-agent@v3.28.0/app/main.js"></script>
</body>

</html>
