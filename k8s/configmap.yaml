# LLM config template — NO SECRETS.
#
# The upstream LLM proxy key lives only in the nginx config (see
# `ca-ccca5-nginx` below), which injects the Authorization header
# server-side via `proxy_set_header`. The browser only sees a relative
# `/api/llm` endpoint and never holds the key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-ccca5-config
  namespace: biodiversity
data:
  # Default model is the OpenRouter-hosted DeepSeek rather than the in-cluster
  # one: same model, usually faster to first token. Both stay in the picker.
  config.template.json: |
    {
        "mcp_server_url": "${MCP_SERVER_URL}",
        "llm_endpoint": "/api/llm"
    }

---
# Nginx configuration. The shared parts (limits, chat, MCP, tiles, the page and
# the health check) are the snippets in nginx/ of SchmidtDSE/glen-template at the
# tag the Deployment clones, filled in from its env at start-up (glen-ops#340).
# Only this app's own routes belong here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-ccca5-nginx
  namespace: biodiversity
data:
  nginx.conf.template: |
    include /etc/nginx/glen/limits.conf;

    server {
        listen 80;
        server_name _;

        include /etc/nginx/glen/base.conf;
        include /etc/nginx/glen/llm.conf;
        include /etc/nginx/glen/mcp.conf;
        include /etc/nginx/glen/spa.conf;
    }
